services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: okcomputerstuff
      MYSQL_USER: blog_user
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: root-change-me
    ports:
      - "3307:3306"
    volumes:
      - okcomputerstuff_mysql:/var/lib/mysql

volumes:
  okcomputerstuff_mysql:
